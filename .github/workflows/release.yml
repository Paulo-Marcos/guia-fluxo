# Release por tag: quando uma tag `v*` e empurrada, valida que dist/ esta em
# sincronia com o manifest e publica o GitHub Release com as notas da secao da
# versao no CHANGELOG.md (o que `changelog compile` fechou). A tag e o unico
# gatilho: se o Release ja existir, so as notas sao atualizadas (D-174). A
# suite (tests.yml) ja gateia cada commit em main.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: render --check (dist em sincronia com o manifest)
        run: python core/build/render-skills.py --check

      - name: Notas da versao a partir do CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [ "$VERSION" != "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "tag $TAG nao bate com o VERSION ($(cat VERSION))" >&2
            exit 1
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md sem secao [$VERSION] (rode changelog compile --version $VERSION antes da tag)" >&2
            exit 1
          fi

      - name: Publicar o GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
